<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">球場上要認得的線</title><desc id="desc">中線把 18×9 公尺球場分成兩半；攻擊線距中線軸線 3 公尺。球落地有部分碰界線即為界內。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><rect x="92" y="55" width="170" height="340" rx="0" fill="#e1eeea" stroke="#116773" stroke-width="2"/><rect x="92" y="168.33333333333334" width="170" height="113.33333333333333" rx="0" fill="#cce2dc" stroke="none" stroke-width="2"/><line x1="92" y1="225" x2="262" y2="225" stroke="#17343c" stroke-width="5" /><line x1="92" y1="168.33333333333334" x2="262" y2="168.33333333333334" stroke="#fff" stroke-width="3" /><line x1="92" y1="281.6666666666667" x2="262" y2="281.6666666666667" stroke="#fff" stroke-width="3" /><line x1="70" y1="55" x2="70" y2="395" stroke="#516b70" stroke-width="2" /><text x="52" y="240" font-size="20" fill="#516b70" text-anchor="middle" font-weight="600">18 m</text><line x1="92" y1="417" x2="262" y2="417" stroke="#516b70" stroke-width="2" /><text x="177" y="447" font-size="22" fill="#516b70" text-anchor="middle" font-weight="600">9 m</text><text x="280" y="233" font-size="21" fill="#17343c" text-anchor="start" font-weight="600">中線／球網</text><text x="280" y="294" font-size="21" fill="#17343c" text-anchor="start" font-weight="600">攻擊線</text><line x1="286" y1="225" x2="286" y2="282" stroke="#bb4c26" stroke-width="3" /><text x="300" y="265" font-size="22" fill="#bb4c26" text-anchor="start" font-weight="600">3 m</text><text x="177" y="255" font-size="22" fill="#116773" text-anchor="middle" font-weight="600">前區</text><text x="454" y="95" font-size="29" fill="#17343c" text-anchor="start" font-weight="600">球壓線＝界內</text><rect x="445" y="145" width="245" height="205" rx="0" fill="#d7e7e0" stroke="none" stroke-width="2"/><rect x="545" y="145" width="13" height="205" rx="0" fill="#fff" stroke="none" stroke-width="2"/><circle cx="546" cy="245" r="43" fill="#e6ae4c" stroke="#17343c" stroke-width="2"/><rect x="537" y="275" width="22" height="8" rx="0" fill="#bb4c26" stroke="none" stroke-width="2"/><path d="M615 316 L557 283" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><text x="455" y="387" font-size="22" fill="#516b70" text-anchor="start" font-weight="600">落地接觸部分碰界線</text></g></svg>