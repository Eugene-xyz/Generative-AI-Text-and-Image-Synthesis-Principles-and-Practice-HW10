<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">三次擊球與合法觸球</title><desc id="desc">攔網觸球另計，之後最多三擊回球；身體任何部位可碰球，但不能接住或拋擲。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><text x="96" y="92" font-size="28" fill="#bb4c26" text-anchor="middle" font-weight="600">攔網</text><circle cx="96" cy="164" r="43" fill="#fae5d7" stroke="#bb4c26" stroke-width="2"/><text x="96" y="173" font-size="25" fill="#bb4c26" text-anchor="middle" font-weight="600">另計</text><path d="M153 164 L230 164" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><circle cx="270" cy="164" r="22" fill="#116773" stroke="#116773" stroke-width="2"/><text x="270" y="172" font-size="24" fill="#fff" text-anchor="middle" font-weight="600">1</text><circle cx="334" cy="164" r="22" fill="#116773" stroke="#116773" stroke-width="2"/><text x="334" y="172" font-size="24" fill="#fff" text-anchor="middle" font-weight="600">2</text><circle cx="398" cy="164" r="22" fill="#116773" stroke="#116773" stroke-width="2"/><text x="398" y="172" font-size="24" fill="#fff" text-anchor="middle" font-weight="600">3</text><text x="270" y="226" font-size="20" fill="#516b70" text-anchor="middle" font-weight="600">第一擊</text><text x="334" y="258" font-size="20" fill="#516b70" text-anchor="middle" font-weight="600">第二擊</text><text x="398" y="226" font-size="20" fill="#516b70" text-anchor="middle" font-weight="600">第三擊</text><text x="505" y="165" font-size="29" fill="#116773" text-anchor="start" font-weight="600">回球</text><path d="M433 164 L484 164" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><line x1="45" y1="292" x2="715" y2="292" stroke="#a8bfbd" stroke-width="2" /><text x="50" y="338" font-size="25" fill="#116773" text-anchor="start" font-weight="600">擊球控制</text><circle cx="230" cy="335" r="11" fill="#e6ae4c" stroke="#17343c" stroke-width="1.5"/><path d="M221.2 332.8 Q230 341.6 238.8 332.8" fill="none" stroke="#17343c" stroke-width="1.3"/><path d="M180 335 L215 335" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><line x1="245" y1="320" x2="255" y2="350" stroke="#116773" stroke-width="4" /><path d="M235 320 L195 300" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><text x="395" y="338" font-size="25" fill="#bb4c26" text-anchor="start" font-weight="600">接住 → 再拋</text><circle cx="570" cy="378" r="11" fill="#e6ae4c" stroke="#17343c" stroke-width="1.5"/><path d="M561.2 375.8 Q570 384.6 578.8 375.8" fill="none" stroke="#17343c" stroke-width="1.3"/><path d="M550 369 Q550 401 592 392" fill="none" stroke="#17343c" stroke-width="4"/><path d="M602 375 L655 338" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><circle cx="680" cy="325" r="11" fill="#e6ae4c" stroke="#17343c" stroke-width="1.5"/><path d="M671.2 322.8 Q680 331.6 688.8 322.8" fill="none" stroke="#17343c" stroke-width="1.3"/><text x="380" y="455" font-size="23" fill="#516b70" text-anchor="middle" font-weight="600">任何部位可碰球；不可持球或拋擲</text></g></svg>