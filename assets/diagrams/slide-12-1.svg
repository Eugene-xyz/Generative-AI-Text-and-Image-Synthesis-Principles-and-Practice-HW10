<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">攔網與後排防守如何合作？</title><desc id="desc">後排依攔網覆蓋、縫隙與對方球路調整；這是一種教學配置，並非每隊的固定站法。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><rect x="56" y="110" width="300" height="300" rx="0" fill="#e1eeea" stroke="#116773" stroke-width="2"/><rect x="56" y="110" width="300" height="100" rx="0" fill="#cce2dc" stroke="none" stroke-width="2"/><line x1="56" y1="110" x2="356" y2="110" stroke="#17343c" stroke-width="6" /><line x1="56" y1="210" x2="356" y2="210" stroke="#fff" stroke-width="4" /><text x="206" y="98" font-size="18" fill="#516b70" text-anchor="middle" font-weight="600">球網</text><text x="206" y="433" font-size="17" fill="#516b70" text-anchor="middle" font-weight="600">己方底線</text><g class="player" data-player="R3"><circle cx="296" cy="332" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="296" y="338" font-size="18" fill="#116773" text-anchor="middle" font-weight="700">R3</text></g><g class="player" data-player="F2"><circle cx="296" cy="176" r="21" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/><text x="296" y="182" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">F2</text></g><g class="player" data-player="F1"><circle cx="206" cy="176" r="21" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/><text x="206" y="182" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">F1</text></g><g class="player" data-player="F3"><circle cx="116" cy="176" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="116" y="182" font-size="18" fill="#116773" text-anchor="middle" font-weight="700">F3</text></g><g class="player" data-player="R1"><circle cx="116" cy="332" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="116" y="338" font-size="18" fill="#116773" text-anchor="middle" font-weight="700">R1</text></g><g class="player" data-player="R2"><circle cx="206" cy="332" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="206" y="338" font-size="18" fill="#116773" text-anchor="middle" font-weight="700">R2</text></g><path d="M206 176 L107 320 L177 320 Z M296 176 L237 320 L320 320 Z" fill="#116773" opacity=".1"/><path d="M275 55 L250 125" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><path d="M250 125 L225 300" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><text x="253" y="208" font-size="19" fill="#bb4c26" text-anchor="middle" font-weight="600">縫隙</text><text x="415" y="113" font-size="28" fill="#17343c" text-anchor="start" font-weight="600">讀對手一傳</text><text x="415" y="181" font-size="28" fill="#17343c" text-anchor="start" font-weight="600">看舉球與攻擊者</text><text x="415" y="249" font-size="28" fill="#17343c" text-anchor="start" font-weight="600">配合己方攔網</text><text x="415" y="332" font-size="23" fill="#516b70" text-anchor="start" font-weight="600">只示一種配置</text><text x="415" y="374" font-size="21" fill="#516b70" text-anchor="start" font-weight="600">責任空間會隨球況調整</text></g></svg>