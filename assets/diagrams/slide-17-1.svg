<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-labelledby="title desc"><title id="title">觀賽小測驗與重點回顧</title><desc id="desc">三題分別檢查發球權與輪轉、移動後身分、攔網後擊球計次；每題都附答案及原因。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><text x="125" y="34" font-size="25" fill="#17343c" text-anchor="middle" font-weight="600">Q1  發球權</text><path d="M65 80 L186 80" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><text x="125" y="135" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">下一球由誰發？</text><text x="380" y="34" font-size="25" fill="#17343c" text-anchor="middle" font-weight="600">Q2  本輪身分</text><g class="player" data-player="後排"><circle cx="380" cy="82" r="24" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/><text x="380" y="88" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">後排</text></g><path d="M335 110 L352 95" fill="none" stroke="#116773" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#teal-arrow)"/><text x="380" y="135" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">移動會改變身分？</text><text x="635" y="34" font-size="25" fill="#17343c" text-anchor="middle" font-weight="600">Q3  觸球計數</text><text x="561" y="89" font-size="21" fill="#bb4c26" text-anchor="middle" font-weight="600">攔網</text><text x="607" y="89" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">＋</text><circle cx="646" cy="82" r="13" fill="#116773" stroke="none" stroke-width="2"/><text x="646" y="88" font-size="16" fill="#fff" text-anchor="middle" font-weight="600">1</text><circle cx="676" cy="82" r="13" fill="#116773" stroke="none" stroke-width="2"/><text x="676" y="88" font-size="16" fill="#fff" text-anchor="middle" font-weight="600">2</text><circle cx="706" cy="82" r="13" fill="#116773" stroke="none" stroke-width="2"/><text x="706" y="88" font-size="16" fill="#fff" text-anchor="middle" font-weight="600">3</text><text x="635" y="135" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">如何計算三擊？</text></g></svg>