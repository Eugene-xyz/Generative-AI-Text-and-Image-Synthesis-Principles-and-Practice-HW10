<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">用 5–1 看懂攻擊組織</title><desc id="desc">S 在前排時，前排另有兩位隊友；S 轉到後排後，三位前排隊友可形成攻擊威脅。同一位 S 繼續組織。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><text x="178" y="42" font-size="28" fill="#17343c" text-anchor="middle" font-weight="600">S 在前排</text><rect x="44" y="95" width="268" height="268" rx="0" fill="#e1eeea" stroke="#116773" stroke-width="2"/><rect x="44" y="95" width="268" height="89.33333333333333" rx="0" fill="#cce2dc" stroke="none" stroke-width="2"/><line x1="44" y1="95" x2="312" y2="95" stroke="#17343c" stroke-width="6" /><line x1="44" y1="184.33333333333331" x2="312" y2="184.33333333333331" stroke="#fff" stroke-width="4" /><text x="178" y="83" font-size="18" fill="#516b70" text-anchor="middle" font-weight="600">球網</text><text x="178" y="386" font-size="17" fill="#516b70" text-anchor="middle" font-weight="600">己方底線</text><g class="player" data-player="OH2"><circle cx="258.4" cy="293.32" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="258.4" y="299.32" font-size="15" fill="#116773" text-anchor="middle" font-weight="700">OH2</text></g><g class="player" data-player="S"><circle cx="258.4" cy="153.96" r="21" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/><text x="258.4" y="159.96" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">S</text></g><g class="player" data-player="MB1"><circle cx="178" cy="153.96" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="178" y="159.96" font-size="15" fill="#116773" text-anchor="middle" font-weight="700">MB1</text></g><g class="player" data-player="OH1"><circle cx="97.6