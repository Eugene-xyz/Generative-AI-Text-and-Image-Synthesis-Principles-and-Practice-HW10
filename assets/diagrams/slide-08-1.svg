<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">自由球員的角色與限制</title><desc id="desc">自由球員替換一名後排隊友，場上仍六人。無論站在哪裡，若觸球時整顆球高於網頂，就不得完成攻擊。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><rect x="36" y="88" width="260" height="260" rx="0" fill="#e1eeea" stroke="#116773" stroke-width="2"/><rect x="36" y="88" width="260" height="86.66666666666667" rx="0" fill="#cce2dc" stroke="none" stroke-width="2"/><line x1="36" y1="88" x2="296" y2="88" stroke="#17343c" stroke-width="6" /><line x1="36" y1="174.66666666666669" x2="296" y2="174.66666666666669" stroke="#fff" stroke-width="4" /><text x="166" y="76" font-size="18" fill="#516b70" text-anchor="middle" font-weight="600">球網</text><text x="166" y="371" font-size="17" fill="#516b70" text-anchor="middle" font-weight="600">己方底線</text><g class="player" data-player="R3"><circle cx="244" cy="280.4" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="244" y="286.4" font-size="18" fill="#116773" text-anchor="middle" font-weight="700">R3</text></g><g class="player" data-player="F3"><circle cx="244" cy="145.2" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="244" y="151.2" font-size="18" fill="#116773" text-anchor="middle" font-weight="700">F3</text></g><g class="player" data-player="F2"><circle cx="166" cy="145.2" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="166" y="151.2" font-size="18" fill="#116773" text-anchor="middle" font-weight="700">F2</text></g><g class="player" data-player="F1"><circle cx="88" cy="145.2" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="88" y="151.2" font-size="18" fill="#116773" text-anchor="middle" font-weight="700">F1</text></g><g class="player" data-player="R1"><circle cx="88" cy="280.4" r="21" fill="#fff" stroke="#116773" stroke-width="2"/><text x="88" y="286.4" font-size="18" fill="#116773" text-anchor="middle" font-weight="700">R1</text></g><g class="player" data-player="L"><circle cx="166" cy="280.4" r="21" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/><text x="166" y="286.4" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">L</text></g><g class="player" data-player="R2"><circle cx="340" cy="320" r="19" fill="#fff" stroke="#116773" stroke-width="2"/><text x="340" y="326" font-size="18" fill="#116773" text-anchor="middle" font-weight="700">R2</text></g><path d="M235 325 L315 325" fill="none" stroke="#116773" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#teal-arrow)"/><text x="340" y="362" font-size="18" fill="#516b70" text-anchor="middle" font-weight="600">場外</text><text x="168" y="425" font-size="22" fill="#116773" text-anchor="middle" font-weight="600">後排替換，場上仍六人</text><text x="420" y="66" font-size="25" fill="#17343c" text-anchor="start" font-weight="600">攻擊限制：任意位置</text><line x1="415" y1="220" x2="715" y2="220" stroke="#116773" stroke-width="3" stroke-dasharray="6 5"/><line x1="654" y1="220" x2="654" y2="340" stroke="#116773" stroke-width="5" /><text x="700" y="250" font-size="19" fill="#516b70" text-anchor="end" font-weight="600">網頂</text><circle cx="482" cy="175" r="16" fill="#e6ae4c" stroke="#17343c" stroke-width="1.5"/><path d="M469.2 171.8 Q482 184.6 494.8 171.8" fill="none" stroke="#17343c" stroke-width="1.3"/><path d="M507 175 L687 175" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><circle cx="710" cy="175" r="13" fill="#e6ae4c" stroke="#17343c" stroke-width="1.5"/><path d="M699.6 172.4 Q710 182.8 720.4 172.4" fill="none" stroke="#17343c" stroke-width="1.3"/><text x="482" y="207" font-size="16" fill="#516b70" text-anchor="middle" font-weight="600">觸球</text><text x="729" y="207" font-size="16" fill="#516b70" text-anchor="end" font-weight="600">完全越網</text><line x1="654" y1="117" x2="654" y2="218" stroke="#a8bfbd" stroke-width="2" stroke-dasharray="4 4"/><text x="421" y="310" font-size="22" fill="#17343c" text-anchor="start" font-weight="600">觸球時整球高於網頂</text><text x="421" y="351" font-size="23" fill="#bb4c26" text-anchor="start" font-weight="600">＋完成攻擊 → 不允許</text><text x="421" y="402" font-size="19" fill="#516b70" text-anchor="start" font-weight="600">此例球已完全越過網面</text></g></svg>