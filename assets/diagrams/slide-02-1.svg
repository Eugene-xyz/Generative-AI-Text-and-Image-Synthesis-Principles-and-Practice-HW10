<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">一個回合在做什麼？</title><desc id="desc">A 發球後，B 常以接、舉、攻回球；A 若攔防成功，可再組織反擊。流程是常見配合，不是每回合的必經步驟。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><rect x="35" y="75" width="140" height="280" rx="0" fill="#e1eeea" stroke="#116773" stroke-width="2"/><rect x="35" y="168.33333333333334" width="140" height="93.33333333333333" rx="0" fill="#cce2dc" stroke="none" stroke-width="2"/><line x1="35" y1="215" x2="175" y2="215" stroke="#17343c" stroke-width="5" /><line x1="35" y1="168.33333333333334" x2="175" y2="168.33333333333334" stroke="#fff" stroke-width="3" /><line x1="35" y1="261.6666666666667" x2="175" y2="261.6666666666667" stroke="#fff" stroke-width="3" /><g class="player" data-player=""><circle cx="63" cy="107.2" r="12" fill="#fff" stroke="#116773" stroke-width="2"/></g><g class="player" data-player=""><circle cx="105" cy="107.2" r="12" fill="#fff" stroke="#116773" stroke-width="2"/></g><g class="player" data-player=""><circle cx="147" cy="107.2" r="12" fill="#fff" stroke="#116773" stroke-width="2"/></g><g class="player" data-player=""><circle cx="63" cy="174.39999999999998" r="12" fill="#fff" stroke="#116773" stroke-width="2"/></g><g class="player" data-player=""><circle cx="105" cy="174.39999999999998" r="12" fill="#fff" stroke="#116773" stroke-width="2"/></g><g class="player" data-player=""><circle cx="147" cy="174.39999999999998" r="12" fill="#fff" stroke="#116773" stroke-width="2"/></g><g class="player" data-player=""><circle cx="63" cy="247.2" r="12" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/></g><g class="player" data-player=""><circle cx="105" cy="247.2" r="12" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/></g><g class="player" data-player=""><circle cx="147" cy="247.2" r="12" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/></g><g class="player" data-player=""><circle cx="63" cy="314.4" r="12" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/></g><g class="player" data-player=""><circle cx="105" cy="314.4" r="12" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/></g><g class="player" data-player=""><circle cx="147" cy="314.4" r="12" fill="#bb4c26" stroke="#bb4c26" stroke-width="2"/></g><text x="105" y="405" font-size="22" fill="#116773" text-anchor="middle" font-weight="600">隔網攻防</text><circle cx="260" cy="95" r="38" fill="#bb4c26" stroke="none" stroke-width="2"/><text x="260" y="103" font-size="23" fill="#fff" text-anchor="middle" font-weight="600">發球</text><circle cx="480" cy="95" r="38" fill="#116773" stroke="none" stroke-width="2"/><text x="480" y="103" font-size="23" fill="#fff" text-anchor="middle" font-weight="600">接發</text><circle cx="480" cy="210" r="38" fill="#116773" stroke="none" stroke-width="2"/><text x="480" y="218" font-size="23" fill="#fff" text-anchor="middle" font-weight="600">舉球</text><circle cx="260" cy="210" r="38" fill="#116773" stroke="none" stroke-width="2"/><text x="260" y="218" font-size="23" fill="#fff" text-anchor="middle" font-weight="600">攻擊</text><circle cx="260" cy="330" r="38" fill="#116773" stroke="none" stroke-width="2"/><text x="260" y="338" font-size="23" fill="#fff" text-anchor="middle" font-weight="600">攔防</text><circle cx="480" cy="330" r="38" fill="#116773" stroke="none" stroke-width="2"/><text x="480" y="338" font-size="23" fill="#fff" text-anchor="middle" font-weight="600">再組織</text><path d="M302 95 L435 95" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><path d="M480 140 L480 165" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><path d="M435 210 L305 210" fill="none" stroke="#bb4c26" stroke-width="3"  m