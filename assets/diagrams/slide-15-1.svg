<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">看比賽，先辨認規則版本</title><desc id="desc">S01 基準在發球擊球瞬間要求接發方符合相對位置；VNL 2026 測試在鳴笛時要求符合次序，發球動作開始即可離開原相對位置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><text x="380" y="35" font-size="23" fill="#516b70" text-anchor="middle" font-weight="600">只比較接發方</text><text x="40" y="76" font-size="25" fill="#116773" text-anchor="start" font-weight="600">S01 基準</text><line x1="95" y1="130" x2="655" y2="130" stroke="#a8bfbd" stroke-width="4" /><circle cx="95" cy="130" r="8" fill="#116773" stroke="none" stroke-width="2"/><text x="95" y="174" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">鳴笛</text><circle cx="365" cy="130" r="8" fill="#116773" stroke="none" stroke-width="2"/><text x="365" y="174" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">發球動作開始</text><circle cx="655" cy="130" r="8" fill="#bb4c26" stroke="none" stroke-width="2"/><text x="655" y="174" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">發球擊球</text><text x="655" y="111" font-size="19" fill="#116773" text-anchor="end" font-weight="600">符合相對位置</text><text x="40" y="286" font-size="25" fill="#bb4c26" text-anchor="start" font-weight="600">VNL 2026 指定測試</text><line x1="95" y1="340" x2="655" y2="340" stroke="#a8bfbd" stroke-width="4" /><circle cx="95" cy="340" r="8" fill="#bb4c26" stroke="none" stroke-width="2"/><text x="95" y="384" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">鳴笛</text><circle cx="365" cy="340" r="8" fill="#116773" stroke="none" stroke-width="2"/><text x="365" y="384" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">發球動作開始</text><circle cx="655" cy="340" r="8" fill="#116773" stroke="none" stroke-width="2"/><text x="655" y="384" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">發球擊球</text><text x="95" y="321" font-size="19" fill="#bb4c26" text-anchor="middle" font-weight="600">符合次序</text><line x1="365" y1="346" x2="655" y2="346" stroke="#bb4c26" stroke-width="5" /><text x="510" y="427" font-size="23" fill="#bb4c26" text-anchor="middle" font-weight="600">可離開原相對位置</text></g></svg>