<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">一分、一局、一場</title><desc id="desc">一般局 24 平後，一隊到 25 比 24 尚未勝出；26 比 24 時才同時滿足 25 分與兩分差。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><text x="380" y="65" font-size="27" fill="#516b70" text-anchor="middle" font-weight="600">本局比分</text><text x="225" y="125" font-size="23" fill="#516b70" text-anchor="middle" font-weight="600">A 隊</text><text x="535" y="125" font-size="23" fill="#516b70" text-anchor="middle" font-weight="600">B 隊</text><text x="225" y="245" font-size="108" fill="#17343c" text-anchor="middle" font-weight="800">25</text><text x="380" y="228" font-size="65" fill="#516b70" text-anchor="middle" font-weight="600">:</text><text x="535" y="245" font-size="108" fill="#17343c" text-anchor="middle" font-weight="800">24</text><line x1="135" y1="285" x2="625" y2="285" stroke="#a8bfbd" stroke-width="2" /><text x="380" y="338" font-size="32" fill="#bb4c26" text-anchor="middle" font-weight="600">還未結束</text><text x="380" y="395" font-size="23" fill="#516b70" text-anchor="middle" font-weight="600">第五局改為 15 分，仍須差兩分</text><text x="380" y="447" font-size="21" fill="#516b70" text-anchor="middle" font-weight="600">已贏局數：先取得三局勝出</text></g></svg>