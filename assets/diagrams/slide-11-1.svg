<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">後排球員也能攻擊</title><desc id="desc">相同的後排高球完成攻擊，起跳腳完全在攻擊線後的例子不構成後排攻擊犯規；碰線起跳的例子構成犯規。落地進前區不是這項判斷的起跳點。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><text x="195" y="36" font-size="24" fill="#116773" text-anchor="middle" font-weight="600">線後起跳：符合此條件</text><text x="195" y="75" font-size="17" fill="#516b70" text-anchor="middle" font-weight="600">後排・整球高於網頂・完成攻擊</text><line x1="32" y1="272" x2="365" y2="272" stroke="#17343c" stroke-width="3" /><line x1="305" y1="165" x2="305" y2="272" stroke="#116773" stroke-width="4" /><line x1="40" y1="165" x2="365" y2="165" stroke="#a8bfbd" stroke-width="1" stroke-dasharray="5 5"/><text x="312" y="192" font-size="18" fill="#516b70" text-anchor="start" font-weight="600">網</text><line x1="180" y1="255" x2="180" y2="283" stroke="#bb4c26" stroke-width="6" /><text x="180" y="311" font-size="18" fill="#bb4c26" text-anchor="middle" font-weight="600">攻擊線</text><path d="M110 265 Q201 80 255 260" fill="none" stroke="#116773" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#teal-arrow)"/><circle cx="258" cy="125" r="13" fill="#e6ae4c" stroke="#17343c" stroke-width="1.5"/><path d="M247.6 122.4 Q258 132.8 268.4 122.4" fill="none" stroke="#17343c" stroke-width="1.3"/><path d="M275 125 L342 125" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><circle cx="357" cy="125" r="10" fill="#e6ae4c" stroke="#17343c" stroke-width="1.5"/><path d="M349 123 Q357 131 365 123" fill="none" stroke="#17343c" stroke-width="1.3"/><text x="258" y="149" font-size="15" fill="#516b70" text-anchor="middle" font-weight="600">觸球</text><text x="372" y="149" font-size="15" fill="#516b70" text-anchor="end" font-weight="600">越網</text><text x="110" y="343" font-size="18" fill="#516b70" text-anchor="middle" font-weight="600">起跳</text><text x="255" y="343" font-size="18" fill="#516b70" text-anchor="middle" font-weight="600">落地</text><rect x="99" y="257" width="22" height="11" rx="0" fill="#bb4c26" stroke="none" stroke-width="2"/><rect x="241" y="262" width="27" height="7" rx="0" fill="#116773" stroke="none" stroke-width="2"/><rect x="85" y="363" width="230" height="65" rx="0" fill="#e1eeea" stroke="none" stroke-width="2"/><line x1="180" y1="363" x2="180" y2="428" stroke="#fff" stroke-width="8" /><rect x="101" y="382" width="18" height="30" rx="0" fill="#bb4c26" stroke="none" stroke-width="2"/><text x="195" y="457" font-size="20" fill="#116773" text-anchor="middle" font-weight="600">起跳腳完整在線後</text><text x="575" y="36" font-size="24" fill="#bb4c26" text-anchor="middle" font-weight="600">碰線起跳：犯規</text><text x="575" y="75" font-size="17" fill="#516b70" text-anchor="middle" font-weight="600">後排・整球高於網頂・完成攻擊</text><line x1="412" y1="272" x2="745" y2="272" stroke="#17343c" stroke-width="3" /><line x1="685" y1="165" x2="685" y2="272" stroke="#116773" stroke-width="4" /><line x1="420" y1="165" x2="745" y2="165" stroke="#a8bfbd" stroke-width="1" stroke-dasharray="5 5"/><text x="692" y="192" font-size="18" fill="#516b70" text-anchor="start" font-weight="600">網</text><line x1="560" y1="255" x2="560" y2="283" stroke="#bb4c26" stroke-width="6" /><text x="560" y="311" font-size="18" fill="#bb4c26" text-anchor="middle" font-weight="600">攻擊線</text><path d="M560 265 Q581 80 635 260" fill="none" stroke="#116773" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#teal-arrow)"/><circle cx="638" cy="125" r="13" fill="#e6ae4c" stroke="#17343c" stroke-width="1.5"/><path d="M627.6 122.4 Q638 132.8 648.4 122.4" fill="none" stroke="#17343c" stroke-width="1.3"/><path d="M655 125 L722 125" fill="none" stroke="#bb4c26" stroke-width="3"  marker-end="url(#arrow)"/><circle cx="737" cy="125" r="10" fill="#e6ae4c" stroke="#17343c" stroke-width="1.5"/><path d="M729 123 Q737 131 745 123" fill="none" stroke="#17343c" stroke-width="1.3"/><text x="638" y="149" font-size="15" fill="#516b70" text-anchor="middle" font-weight="600">觸球</text><text x="752" y="149" font-size="15" fill="#516b70" text-anchor="end" font-weight="600">越網</text><text x="560" y="343" font-size="18" fill="#516b70" text-anchor="middle" font-weight="600">起跳</text><text x="635" y="343" font-size="18" fill="#516b70" text-anchor="middle" font-weight="600">落地</text><rect x="549" y="257" width="22" height="11" rx="0" fill="#bb4c26" stroke="none" stroke-width="2"/><rect x="621" y="262" width="27" height="7" rx="0" fill="#116773" stroke="none" stroke-width="2"/><rect x="465" y="363" width="230" height="65" rx="0" fill="#e1eeea" stroke="none" stroke-width="2"/><line x1="560" y1="363" x2="560" y2="428" stroke="#fff" stroke-width="8" /><rect x="551" y="382" width="18" height="30" rx="0" fill="#bb4c26" stroke="none" stroke-width="2"/><text x="575" y="457" font-size="20" fill="#bb4c26" text-anchor="middle" font-weight="600">起跳腳碰到線</text></g></svg>