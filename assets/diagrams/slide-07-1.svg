<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">六個人如何分工？</title><desc id="desc">舉球組織、主攻接發與攻擊、攔中快攻與攔網、接應承擔攻擊、自由球員專注後排；這些是常見分工，不是整場固定站位。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#bb4c26"/></marker><marker id="teal-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#116773"/></marker></defs><g font-family="Microsoft JhengHei, PingFang TC, Arial, sans-serif"><circle cx="77" cy="62" r="27" fill="#116773" stroke="none" stroke-width="2"/><text x="77" y="69" font-size="19" fill="#fff" text-anchor="middle" font-weight="600">S</text><text x="132" y="69" font-size="26" fill="#17343c" text-anchor="start" font-weight="600">舉球員</text><line x1="292" y1="62" x2="350" y2="62" stroke="#a8bfbd" stroke-width="2" /><text x="380" y="69" font-size="25" fill="#516b70" text-anchor="start" font-weight="600">組織與溝通</text><circle cx="77" cy="142" r="27" fill="#116773" stroke="none" stroke-width="2"/><text x="77" y="149" font-size="19" fill="#fff" text-anchor="middle" font-weight="600">OH</text><text x="132" y="149" font-size="26" fill="#17343c" text-anchor="start" font-weight="600">主攻</text><line x1="292" y1="142" x2="350" y2="142" stroke="#a8bfbd" stroke-width="2" /><text x="380" y="149" font-size="25" fill="#516b70" text-anchor="start" font-weight="600">接發與側翼攻擊</text><circle cx="77" cy="222" r="27" fill="#116773" stroke="none" stroke-width="2"/><text x="77" y="229" font-size="19" fill="#fff" text-anchor="middle" font-weight="600">MB</text><text x="132" y="229" font-size="26" fill="#17343c" text-anchor="start" font-weight="600">攔中</text><line x1="292" y1="222" x2="350" y2="222" stroke="#a8bfbd" stroke-width="2" /><text x="380" y="229" font-size="25" fill="#516b70" text-anchor="start" font-weight="600">快攻與攔網</text><circle cx="77" cy="302" r="27" fill="#116773" stroke="none" stroke-width="2"/><text x="77" y="309" font-size="19" fill="#fff" text-anchor="middle" font-weight="600">OPP</text><text x="132" y="309" font-size="26" fill="#17343c" text-anchor="start" font-weight="600">接應</text><line x1="292" y1="302" x2="350" y2="302" stroke="#a8bfbd" stroke-width="2" /><text x="380" y="309" font-size="25" fill="#516b70" text-anchor="start" font-weight="600">承擔攻擊</text><circle cx="77" cy="382" r="27" fill="#bb4c26" stroke="none" stroke-width="2"/><text x="77" y="389" font-size="19" fill="#fff" text-anchor="middle" font-weight="600">L</text><text x="132" y="389" font-size="26" fill="#17343c" text-anchor="start" font-weight="600">自由球員</text><line x1="292" y1="382" x2="350" y2="382" stroke="#a8bfbd" stroke-width="2" /><text x="380" y="389" font-size="25" fill="#516b70" text-anchor="start" font-weight="600">後排接發與防守</text></g></svg>